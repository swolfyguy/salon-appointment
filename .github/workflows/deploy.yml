# Deploys to Cloudflare on every push to main. Creates the D1 database and R2
# bucket on first run, so nothing has to be set up by hand.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   required. Token with Workers Scripts:Edit, D1:Edit, R2 Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID  required. From the Cloudflare dashboard sidebar
#   ADMIN_TOKEN            optional. Owner password for /admin; pushed to the Worker after deploy
#   ANTHROPIC_API_KEY      optional. Enables the AI look advisor
#   NOTIFY_WEBHOOK         optional. URL that receives booking events
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DB_NAME: salon-appointment
  BUCKET: salon-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check secrets are set
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }

      - name: Syntax check
        run: node --check worker/index.js && node --check assets/js/app.js && node --check assets/js/config.js

      - name: Build static files
        run: npm run build

      - name: Ensure D1 database exists and inject its id
        run: |
          set -e
          lookup() { npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid' | head -1; }
          ID="$(lookup)"
          if [ -z "$ID" ]; then
            echo "Creating D1 database $DB_NAME"
            npx wrangler d1 create "$DB_NAME"
            ID="$(lookup)"
          fi
          [ -n "$ID" ] || { echo "::error::Could not find or create D1 database $DB_NAME"; exit 1; }
          echo "Using database id $ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          grep -q "$ID" wrangler.jsonc

      - name: Ensure R2 bucket exists
        run: |
          set +e
          out="$(npx wrangler r2 bucket create "$BUCKET" 2>&1)"; code=$?
          set -e
          echo "$out"
          if [ $code -eq 0 ] || echo "$out" | grep -qi "already exists"; then
            echo "Bucket $BUCKET is ready"
          else
            echo "::error::Could not create R2 bucket $BUCKET (does the API token have Workers R2 Storage: Edit?)"
            exit 1
          fi

      - name: Apply database schema
        # Safe to re-run: every statement uses IF NOT EXISTS.
        run: npx wrangler d1 execute "$DB_NAME" --remote --file=worker/schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Push Worker secrets
        # Only the ones set in GitHub. Re-running with the same values is harmless.
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          set -e
          for name in ADMIN_TOKEN ANTHROPIC_API_KEY NOTIFY_WEBHOOK; do
            val="${!name}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name"
              echo "Set $name"
            else
              echo "Skipping $name (not set in GitHub secrets)"
            fi
          done
